<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いろどり動詞活用</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
}

/* ロゴ */
.logo {
  display: block;
  width: 120px;
  height: auto;
  margin: 0 auto 20px;
}

/* コース名 */
.course-title {
  font-size: 28px;
  font-weight: bold;
  margin: 10px 0 12px;
}

/* 活用ボタン */
.lesson-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 30px;
}

.lesson-button {
  font-size: 24px;
  line-height: 1.1;
  padding: 12px 25px;
  border: 2px solid #999;
  border-radius: 12px;
  background: #eee;
  color: #333;
  cursor: pointer;
}

.lesson-button:active {
  background: #ddd;
}

/* 選択後の見出し */
.selected-range-title {
  display: none;
  font-size: 28px;
  font-weight: bold;
  margin: 0 0 80px;
}

/* 動詞 */
.question {
  display: none;
  font-size: clamp(40px, 12vw, 100px);
  margin: 40px 0 40px;
  line-height: 1.3;
  white-space: nowrap;
  overflow-wrap: normal;
  width: 100%;
}

/* ルビの位置を調整 */

.question ruby,
.reading ruby {
  ruby-align: center;
  ruby-position: over;
  white-space: nowrap;
}

.question rt,
.reading rt {
  font-size: 0.5em;
  line-height: 1;
  text-align: center;
}

/* 答え */
.reading {
  display: none;
  font-size: clamp(36px, 10vw, 80px);
  color: #333;
  min-height: 100px;
  width: 100%;
  text-align: center;
  margin-bottom: 20px;
  white-space: nowrap;
  overflow-wrap: normal;
  line-height: 1.3;
}

/* ▶ボタン */

.answer-button {
  display: none;
  font-size: clamp(50px, 12vw, 80px);
  padding: 18px 40px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  vertical-align: middle;
  line-height: 1;
  position: fixed;
  left: 50%;
  bottom: 100px;
  transform: translateX(-50%);
}

/* 問題数カウンター */
.counter {
  display: none;
  position: fixed;
  top: 10px;
  right: 15px;
  font-size: 40px;
  color: #888;
  z-index: 1000;
}

/* 読み込み中 */
.loading {
  font-size: 24px;
  color: #666;
  margin-top: 50px;
}

/* 親ページに戻るボタン */
.portal-back-btn {
  padding: 8px 18px;
  margin-top: 40px;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.portal-back-btn.hidden {
  display: none;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

.lesson-buttons {
  gap: 8px;
  margin-bottom: 25px;
}

.lesson-button {
  font-size: 16px;
  padding: 14px 2px;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
}

  .course-title,
  .selected-range-title {
    font-size: 24px;
  }

.question {
  margin-top: 35px;
  font-size: clamp(24px, 7.2vw, 60px);
}

.reading {
  min-height: 90px;
  font-size: clamp(22px, 6vw, 48px);
}
  .answer-button {
    width: 90%;
    max-width: 320px;
  }
}
</style>

<!-- SheetJS -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DDD1Y5SELD"></script>
<script>
window.dataLayer = window.dataLayer || [];

function gtag() {
  dataLayer.push(arguments);
}

gtag('js', new Date());
gtag('config', 'G-DDD1Y5SELD');
</script>
</head>

<body>

<!-- コース・活用選択画面 -->

<div id="selection-screen">

  <img src="logo.png" class="logo" alt="logo">

  <div class="course-title">A1</div>

  <div class="lesson-buttons">
    <button class="lesson-button"
      onclick="startQuiz('A1', 'ますけい')">ますけい</button>

    <button class="lesson-button"
      onclick="startQuiz('A1', 'じしょけい')">じしょけい</button>

    <button class="lesson-button"
      onclick="startQuiz('A1', 'てけい')">てけい</button>

    <button class="lesson-button"
      onclick="startQuiz('A1', 'ないけい')">ないけい</button>
  </div>

  <div class="course-title">A2.1</div>

  <div class="lesson-buttons">
    <button class="lesson-button"
      onclick="startQuiz('A2.1', 'ますけい')">ますけい</button>

    <button class="lesson-button"
      onclick="startQuiz('A2.1', 'じしょけい')">じしょけい</button>

    <button class="lesson-button"
      onclick="startQuiz('A2.1', 'てけい')">てけい</button>

    <button class="lesson-button"
      onclick="startQuiz('A2.1', 'ないけい')">ないけい</button>
  </div>

  <button
    type="button"
    class="portal-back-btn"
    onclick="location.href='https://cpro-room.github.io/JP-Learning/'">
    Back
  </button>

</div>

<!-- 解答画面のロゴ -->
<img src="logo.png" class="logo" id="answer-logo" alt="logo" style="display:none;">

<!-- 選択後の見出し -->
<div class="selected-range-title" id="selected-range-title"></div>

<!-- 読み込み中 -->
<div class="loading" id="loading">
  動詞データを読み込んでいます……
</div>

<!-- 問題 -->
<div class="question" id="question"></div>

<!-- 答え -->
<div class="reading" id="reading"></div>

<!-- 次へ進むボタン -->
<button class="answer-button" id="answer-button"
  onclick="handle()">▶</button>

<!-- 問題数カウンター -->
<div class="counter" id="counter">1</div>

<script>

/* =========================================
   データ
   ========================================= */

let originalWords = [];
let words = [];

let currentIndex = 0;
let revealed = false;

let selectedCourse = "";
let selectedForm = "";

/* =========================================
   Excel読み込み
   ========================================= */

async function loadExcel() {

  try {

    const response = await fetch("動詞活用.xlsx");

    if (!response.ok) {
      throw new Error("Excelファイルを読み込めませんでした。");
    }

    const arrayBuffer = await response.arrayBuffer();

    const workbook = XLSX.read(arrayBuffer, {
      type: "array"
    });

    if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
      throw new Error("Excelにシートがありません。");
    }

    const sheet = workbook.Sheets[workbook.SheetNames[0]];

    if (!sheet) {
      throw new Error("Excelのシートを取得できませんでした。");
    }

    /*
      A列：コース名
      B列：ます形
      C列：じしょ形
      D列：て形
    */

    const rows = XLSX.utils.sheet_to_json(sheet, {
      header: 1,
      defval: ""
    });

    if (rows.length < 2) {
      throw new Error("Excelに動詞データがありません。");
    }

    originalWords = [];

    /* 1行目は項目名なので、2行目から読み込む */

    for (let i = 1; i < rows.length; i++) {

      const row = rows[i];

      if (!row) {
        continue;
      }

      const course = String(row[0] ?? "").trim();
      const masu = String(row[1] ?? "").trim();
      const dictionary = String(row[2] ?? "").trim();
      const te = String(row[3] ?? "").trim();
      const nai = String(row[4] ?? "").trim();

      /* 必要な項目がそろっている行だけ読み込む */

      if (
        !["A1", "A2.1"].includes(course) ||
        masu === "" ||
        dictionary === "" ||
        te === ""
      ) {
        continue;
      }

originalWords.push({
  course: course,
  masu: masu,
  dictionary: dictionary,
  te: te,
  nai: nai
});

    }

    if (originalWords.length === 0) {
      throw new Error("使用できる動詞データがありません。");
    }

    document.getElementById("loading").style.display = "none";

  } catch (error) {

    console.error(error);

    document.getElementById("loading").textContent =
      "動詞活用.xlsxを読み込めませんでした。ファイル名と保存場所を確認してください。";

  }

}

/* =========================================
   活用練習開始
   ========================================= */

function startQuiz(course, form) {

  if (originalWords.length === 0) {
    alert("動詞データを読み込めていません。Excelファイルを確認してください。");
    return;
  }

  selectedCourse = course;
  selectedForm = form;

  /* 選択画面を隠す */

  document.getElementById("selection-screen").style.display = "none";
  document.getElementById("answer-logo").style.display = "block";
  document.querySelector(".portal-back-btn").classList.add("hidden");

  /* 選択したコースと活用形を表示 */

  const title = document.getElementById("selected-range-title");

  title.textContent = course + "　" + form;
  title.style.display = "block";

  /* 問題画面を表示 */

  document.getElementById("question").style.display = "block";
 document.getElementById("reading").style.display = "block";
  document.getElementById("answer-button").style.display = "inline-block";
  document.getElementById("counter").style.display = "block";

  /* 選択したコースの動詞を抽出してシャッフル */

  words = originalWords.filter(word => word.course === course);
  words = shuffle([...words]);

  currentIndex = 0;
  revealed = false;

  render();

  /* Google Analytics */

  gtag("event", "select_verb_form", {
    course_name: course,
    form_name: form
  });

}

/* =========================================
   シャッフル
   ========================================= */

function shuffle(arr) {

  for (let i = arr.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];

  }

  return arr;

}

/* =========================================
   問題と答えの取得
   ========================================= */

function getQuestionAndAnswer(word) {

  if (selectedForm === "ますけい") {
    return {
      question: word.dictionary,
      answer: word.masu
    };
  }

  if (selectedForm === "じしょけい") {
    return {
      question: word.masu,
      answer: word.dictionary
    };
  }

  if (selectedForm === "てけい") {
    return {
      question: word.masu,
      answer: word.te
    };
  }

  if (selectedForm === "ないけい") {
    return {
      question: word.masu,
      answer: word.nai
    };
  }

}

/* =========================================
   【】のルビを表示形式に変換
   ========================================= */

function rubyText(text) {

  const escaped = String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  return escaped.replace(
    /([\u4E00-\u9FFF\uF900-\uFAFF々〆ヵヶ]+)【([^【】]+)】/g,
    "<ruby>$1<rt>$2</rt></ruby>"
  );

}

/* =========================================
   表示更新
   ========================================= */

function render() {

  if (words.length === 0) {
    document.getElementById("question").textContent = "";
    document.getElementById("reading").textContent = "";
    document.getElementById("counter").textContent = "0";
    return;
  }

  const word = words[currentIndex];
  const pair = getQuestionAndAnswer(word);


  /* 問題を表示（ルビ対応） */

  document.getElementById("question").innerHTML =
    rubyText(pair.question);

  /* 答えは▶を押すまで隠す（ルビ対応） */

document.getElementById("reading").innerHTML =
  revealed ? rubyText(pair.answer) : "";

  /* 問題数を表示（最初は1） */

  document.getElementById("counter").textContent =
    currentIndex + 1;

  adjustQuestionSize();

  adjustAnswerSize();

}

/* =========================================
   文字サイズ自動調整
   ========================================= */

function adjustQuestionSize() {

  const element = document.getElementById("question");

element.style.fontSize = window.innerWidth <= 600 ? "60px" : "60px";

  const maxWidth = element.clientWidth;

  while (
    element.scrollWidth > maxWidth &&
    parseFloat(getComputedStyle(element).fontSize) > 12
  ) {

    const size = parseFloat(getComputedStyle(element).fontSize);

    element.style.fontSize = (size - 2) + "px";

  }

}

function adjustAnswerSize() {

  const element = document.getElementById("reading");

element.style.fontSize = window.innerWidth <= 600 ? "48px" : "50px";

  const maxWidth = element.clientWidth;

  while (
    element.scrollWidth > maxWidth &&
    parseFloat(getComputedStyle(element).fontSize) > 12
  ) {

    const size = parseFloat(getComputedStyle(element).fontSize);

    element.style.fontSize = (size - 2) + "px";

  }

}

/* =========================================
   ▶ボタン
   ========================================= */

function handle() {

  if (words.length === 0) {
    return;
  }

  /* 1回目：答えを表示 */

  if (!revealed) {

    revealed = true;

    render();

    return;

  }

  /* 2回目：次の問題へ */

  currentIndex++;

  /* 最後まで進んだら再シャッフル */

  if (currentIndex >= words.length) {

    words = shuffle([...words]);

    currentIndex = 0;

  }

  revealed = false;

  render();

}

/* =========================================
   起動
   ========================================= */

loadExcel();

</script>

</body>
</html>
